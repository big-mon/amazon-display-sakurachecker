name: Deploy to Chrome Web Store

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-chrome-web-store
  queue: max
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check if version changed
        id: version-check
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "push" ]; then
            base_sha="$BEFORE_SHA"
          else
            base_sha="HEAD~1"
          fi

          if [ -z "$base_sha" ] || [[ "$base_sha" =~ ^0+$ ]] || ! git cat-file -e "${base_sha}:package.json" 2>/dev/null; then
            echo "version-changed=false" >> "$GITHUB_OUTPUT"
            echo "No comparable package.json available, skipping deployment"
            exit 0
          fi

          previous_version="$(git show "${base_sha}:package.json" | python3 -c 'import json, sys; print(json.load(sys.stdin)["version"])')"
          current_version="$(python3 -c 'import json, pathlib; print(json.loads(pathlib.Path("package.json").read_text(encoding="utf-8"))["version"])')"

          echo "Comparison base: ${base_sha}"
          echo "Previous package.json version: ${previous_version}"
          echo "Current package.json version: ${current_version}"

          if [ "$previous_version" != "$current_version" ]; then
            echo "version-changed=true" >> "$GITHUB_OUTPUT"
            echo "Version changed, proceeding with deployment"
          else
            echo "version-changed=false" >> "$GITHUB_OUTPUT"
            echo "Version unchanged, skipping deployment"
          fi

      - name: Setup Node.js
        if: steps.version-check.outputs.version-changed == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        if: steps.version-check.outputs.version-changed == 'true'
        run: npm ci

      - name: Install Playwright Chromium
        if: steps.version-check.outputs.version-changed == 'true'
        run: npx playwright install --with-deps chromium

      - name: Run tests
        if: steps.version-check.outputs.version-changed == 'true'
        run: npm run test:deploy

      - name: Create extension zip
        if: steps.version-check.outputs.version-changed == 'true'
        run: npm run zip

      - name: Upload to Chrome Web Store
        if: steps.version-check.outputs.version-changed == 'true'
        env:
          CHROME_EXTENSION_ZIP_PATH: extension.zip
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          CHROME_PUBLISH: "true"
        run: node scripts/upload-chrome-web-store.js
